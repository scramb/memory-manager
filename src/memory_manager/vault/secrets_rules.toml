# SPDX-License-Identifier: AGPL-3.0-only
#
# Gitleaks-style secret detection rules, loaded by `vault/secrets.py`.
#
# Each `[[rule]]` is checked against the full note text:
#   id          unique rule identifier, also used as the `Finding.rule_id`
#   description human-readable name used in the rejection message
#   regex       Python `re` pattern; the candidate value is the whole match
#               (group 0) unless `group` points at a capturing group
#   dotall      optional, default false; set for patterns that must span
#               multiple lines (e.g. a JSON blob with keys on separate lines)
#   group       optional, default 0; which capture group holds the secret
#               value that `entropy` and rule-specific checks are applied to
#   entropy     optional minimum Shannon entropy (bits/char) of the candidate
#   keywords    optional list of lower-case substrings; at least one must be
#               present in the lower-cased text before the regex is tried
#               (cheap prefilter, not a security boundary by itself)
#
# `[[allow]]` entries are regexes matched against the candidate value
# (full match, case-sensitive); a match suppresses the finding. They exist
# for documented, non-secret placeholders - not to narrow real matches.

[[rule]]
id = "private-key"
description = "a private key block"
regex = '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
keywords = ["private key"]

[[rule]]
id = "aws-access-key-id"
description = "an AWS access key id"
regex = '\bA(?:KIA|SIA)[0-9A-Z]{16}\b'
keywords = ["akia", "asia"]

[[rule]]
id = "aws-secret-access-key"
description = "an AWS secret access key"
regex = "(?i)aws_secret_access_key\\s*[:=]\\s*[\"']?([A-Za-z0-9/+=]{40})[\"']?"
group = 1
keywords = ["aws_secret_access_key", "aws-secret-access-key"]

[[rule]]
id = "gcp-service-account"
description = "a GCP service account key"
regex = '"type"\s*:\s*"service_account"[\s\S]{0,2000}?"private_key"'
dotall = true
keywords = ["service_account"]

[[rule]]
id = "gcp-api-key"
description = "a GCP API key"
regex = '\bAIza[0-9A-Za-z\-_]{35}\b'
keywords = ["aiza"]

[[rule]]
id = "azure-storage-key"
description = "an Azure storage account key"
regex = 'AccountKey=([A-Za-z0-9+/]{20,}={0,2})'
group = 1
keywords = ["accountkey="]

[[rule]]
id = "azure-client-secret"
description = "an Azure client secret"
regex = "(?i)azure_client_secret\\s*[:=]\\s*[\"']?([^\\s\"']{8,})[\"']?"
group = 1
entropy = 3.0
keywords = ["azure_client_secret", "azure-client-secret"]

[[rule]]
id = "github-pat"
description = "a GitHub personal access token"
regex = '\bghp_[A-Za-z0-9]{36}\b'
keywords = ["ghp_"]

[[rule]]
id = "github-app-token"
description = "a GitHub OAuth/app token"
regex = '\b(?:gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b'
keywords = ["gho_", "ghu_", "ghs_", "ghr_"]

[[rule]]
id = "gitlab-pat"
description = "a GitLab personal access token"
regex = '\bglpat-[A-Za-z0-9_-]{20}\b'
keywords = ["glpat-"]

[[rule]]
id = "slack-token"
description = "a Slack token"
regex = '\bxox[abprs]-[A-Za-z0-9-]{10,48}\b'
keywords = ["xox"]

[[rule]]
id = "slack-webhook"
description = "a Slack incoming webhook URL"
regex = 'https://hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+'
keywords = ["hooks.slack.com"]

[[rule]]
id = "jwt"
description = "a JWT"
regex = '\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
keywords = ["eyj"]

[[rule]]
id = "generic-assignment"
description = "a high-entropy secret assignment"
regex = "(?i)(key|token|secret|password|passwd|pwd|api[_-]?key)\\s*[:=]\\s*[\"']?([^\\s\"']{12,})[\"']?"
group = 2
entropy = 3.5
keywords = ["key", "token", "secret", "password", "passwd", "pwd"]

[[rule]]
id = "iban"
description = "an IBAN"
regex = '\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){2,6}(?:[ ]?[A-Z0-9]{1,4})?\b'

[[rule]]
id = "credit-card"
description = "a credit card number"
regex = '\b(?:\d[ -]?){13,19}\b'

[[allow]]
# Angle-bracket placeholders, e.g. "password: <redacted>".
regex = '(?i)^<[^<>]*>$'

[[allow]]
# Repeated placeholder characters, e.g. "token=xxxxxxxxxxxx".
regex = '^[xX]+$'

[[allow]]
# Shell/CI-style variable references, e.g. "token=${SECRETS_MANAGER:prod/db}".
regex = '^\$\{[^{}]*\}$'
