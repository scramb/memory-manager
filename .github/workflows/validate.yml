name: validate
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release-please.yml for the release PR's head branch -
  # its own pull_request events don't fire because release-please opens
  # and updates it with GITHUB_TOKEN. See docs/releasing.md.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Planning skeleton
        run: scripts/check-docs.sh

  deploy:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      TOFU_VERSION: v1.13.1
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Entra app-registration module (deploy/entra, #256)
        run: |
          curl -sL "https://github.com/opentofu/opentofu/releases/download/${TOFU_VERSION}/tofu_${TOFU_VERSION#v}_linux_amd64.zip" -o /tmp/tofu.zip
          unzip -o /tmp/tofu.zip tofu -d /tmp
          sudo install -m 0755 /tmp/tofu /usr/local/bin/tofu
          tofu -chdir=deploy/entra fmt -check
          tofu -chdir=deploy/entra init -backend=false
          tofu -chdir=deploy/entra validate
          # Local provider plugin cache, gitignored - clean it up so the
          # placeholder check below (which walks the whole deploy/ tree, not
          # just what Git tracks) doesn't trip over third-party CHANGELOGs.
          rm -rf deploy/entra/.terraform
      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Render and validate the Kustomize base (incl. CRD schemas)
        run: |
          kubectl kustomize deploy \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Render and validate the Flux example (incl. CRD schemas)
        run: |
          kubectl kustomize deploy/flux \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Render and validate the Flux enterprise example (incl. CRD schemas, #257)
        run: |
          kubectl kustomize deploy/flux/enterprise \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Lint the Helm chart
        run: helm lint charts/memory-manager
      - name: Render and validate the Helm chart (default values)
        run: |
          helm template t charts/memory-manager \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Render and validate the Helm chart (every optional feature on)
        run: |
          helm template t charts/memory-manager -f charts/memory-manager/ci/all-features-values.yaml \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Render and validate the Helm chart (enterprise profile, #250)
        run: |
          helm template t charts/memory-manager -f charts/memory-manager/values-enterprise.yaml \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Check the PrometheusRule's own rules with promtool (#265)
        run: |
          # `spec.groups` dedented into a bare `groups:` rule file -
          # promtool's rulefmt does a strict unmarshal and rejects the
          # PrometheusRule's own apiVersion/kind/metadata/spec wrapper
          # (verified locally: "field apiVersion not found in type
          # rulefmt.RuleGroups"). "spec:"'s own children are always
          # indented exactly 2 spaces (helm template's fixed YAML
          # encoding), so stripping that prefix from every line after it
          # is enough - no YAML library needed for this.
          helm template t charts/memory-manager --set prometheusRule.enabled=true \
              --show-only templates/prometheusrule.yaml \
            | awk '/^spec:/{flag=1; next} flag' | sed 's/^  //' > /tmp/mm-rules-git.yaml
          helm template t charts/memory-manager -f charts/memory-manager/values-enterprise.yaml \
              --show-only templates/prometheusrule.yaml \
            | awk '/^spec:/{flag=1; next} flag' | sed 's/^  //' > /tmp/mm-rules-enterprise.yaml
          podman run --rm --entrypoint /bin/promtool \
            -v /tmp/mm-rules-git.yaml:/rules.yaml:Z \
            docker.io/prom/prometheus:v3.15.0 check rules /rules.yaml
          podman run --rm --entrypoint /bin/promtool \
            -v /tmp/mm-rules-enterprise.yaml:/rules.yaml:Z \
            docker.io/prom/prometheus:v3.15.0 check rules /rules.yaml
      - name: No operator-specific hostnames or IPs
        run: scripts/check-deploy-placeholders.sh
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Chart tests (storage.backend <-> scaling guard, api/worker split, #249/#250)
        env:
          MM_REQUIRE_HELM: "1"
        run: uv run pytest tests/chart

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm -d mm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MM_TEST_DATABASE_URL: postgresql://mm:mm@localhost:5432/mm
      MM_TEST_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # `otel` is an optional extra (observability/tracing.py, #43/#262) -
      # `uv run` (what `make check`/`make eval` use below) never installs an
      # extra on its own, only `uv sync` does; synced once here so
      # tests/test_tracing.py runs for real instead of skipping (its own
      # module docstring), and so `uv run mypy` sees the SDK's real types
      # instead of relying only on the `ignore_missing_imports` override.
      - name: Install the otel extra
        run: uv sync --extra otel
      - name: make check
        run: make check
      - name: make eval
        run: make eval

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push, no load - cross-arch smoke is amd64-only below)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            MM_GIT_SHA=${{ github.sha }}
          tags: memory-manager:dev
      - name: Build amd64 only, loaded for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            MM_GIT_SHA=${{ github.sha }}
          tags: memory-manager:dev
      - name: Smoke test
        env:
          # The amd64 image above was loaded into the docker daemon
          # (`load: true`), not podman's storage - even though the
          # runner may have both, this run must use the one that
          # actually has the image.
          CONTAINER_ENGINE: docker
        run: scripts/smoke-container.sh memory-manager:dev

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Quickstart smoke test (docker compose, no ollama profile)
        env:
          COMPOSE_ENGINE: docker compose
        run: scripts/smoke-compose.sh
