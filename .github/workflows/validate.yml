name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Planning skeleton
        run: scripts/check-docs.sh

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm -d mm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MM_TEST_DATABASE_URL: postgresql://mm:mm@localhost:5432/mm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: make check
        run: make check
      - name: make eval
        run: make eval
