name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Planning skeleton
        run: scripts/check-docs.sh

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mm -d mm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MM_TEST_DATABASE_URL: postgresql://mm:mm@localhost:5432/mm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: make check
        run: make check
      - name: make eval
        run: make eval

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push, no load - cross-arch smoke is amd64-only below)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            MM_GIT_SHA=${{ github.sha }}
          tags: memory-manager:dev
      - name: Build amd64 only, loaded for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            MM_GIT_SHA=${{ github.sha }}
          tags: memory-manager:dev
      - name: Smoke test
        env:
          # The amd64 image above was loaded into the docker daemon
          # (`load: true`), not podman's storage - even though the
          # runner may have both, this run must use the one that
          # actually has the image.
          CONTAINER_ENGINE: docker
        run: scripts/smoke-container.sh memory-manager:dev

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Quickstart smoke test (docker compose, no ollama profile)
        env:
          COMPOSE_ENGINE: docker compose
        run: scripts/smoke-compose.sh
