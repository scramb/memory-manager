name: release-please

# Opens/updates the "chore(release): x.y.z" PR on every push to main,
# tracking the next release in release-please-config.json /
# .release-please-manifest.json. Merging that PR is what actually tags
# the repo (`v*`) and triggers .github/workflows/release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
