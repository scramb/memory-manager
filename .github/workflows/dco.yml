name: dco
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on every commit
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            [[ -z "$sha" ]] && continue
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # release-please's and Dependabot's own commits (e.g. the
            # "chore(release): x.y.z" PR, or a dependency bump) are made
            # through the GitHub API with GITHUB_TOKEN/a bot identity,
            # which never carries a Signed-off-by trailer - exempt these
            # known bot identities only, every human commit still needs
            # one. release-please-action with the default GITHUB_TOKEN
            # commits as "github-actions[bot]"; a dedicated app/PAT would
            # show up as "release-please[bot]" instead - both covered.
            case "$author" in
              "github-actions[bot] <"*"@users.noreply.github.com>"|\
              "release-please[bot] <"*"@users.noreply.github.com>"|\
              "dependabot[bot] <"*"@users.noreply.github.com>")
                continue
                ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $sha is missing a 'Signed-off-by:' trailer (run 'git commit -s')"
              fail=1
            fi
          done < <(git log --format=%H "$range")
          exit "$fail"
