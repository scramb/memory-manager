# SPDX-License-Identifier: AGPL-3.0-only
#
# Everything memory-manager needs that must not sit in Git: the vault
# deploy key (and its pinned host key), the vault webhook's HMAC secret,
# the OIDC client secret and the Fernet key the embedded OAuth
# authorization server encrypts DCR client secrets with (ADR-0004). None
# of this is in the cluster's own secret store - an External Secrets
# Operator `ClusterSecretStore` (Vault/OpenBao/AWS Secrets Manager/...,
# whatever the operator already runs) is, via `secret-store` below: a
# placeholder name (lower-case: a Kubernetes object name must be a valid
# RFC 1123 DNS label), set to the real one in the operator's overlay. See
# deploy/README.md's "Secrets" table for how to generate each value - every
# key listed under `data` here must exist in the store, or this
# `ExternalSecret`'s sync fails for *all* of them, not just the missing
# one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-manager-secrets
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: memory-manager-secrets
    creationPolicy: Owner
  data:
    # Mounted as files (deployment.yaml's `ssh` volume), not env vars -
    # `ssh-keygen -t ed25519` for the key, `ssh-keyscan` for the pinned
    # host key (deploy/README.md).
    - secretKey: SSH_PRIVATE_KEY
      remoteRef:
        key: memory-manager/vault-deploy-key
        property: private-key
    - secretKey: SSH_KNOWN_HOSTS
      remoteRef:
        key: memory-manager/vault-deploy-key
        property: known-hosts
    # `openssl rand -hex 32` or equivalent; used to verify the GitHub/
    # Gitea webhook's HMAC signature (http.py, /hooks/vault).
    - secretKey: VAULT_WEBHOOK_SECRET
      remoteRef:
        key: memory-manager/webhook
        property: secret
    # The upstream OIDC provider's client secret for LOGIN_MODE=oidc
    # (ADR-0004 L2); the provider issues this when the client is registered.
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: memory-manager/oidc
        property: client-secret
    # Generate with the one-liner in src/memory_manager/auth/store.py's
    # own `OAUTH_CLIENT_SECRET_KEY must be a Fernet key` error message.
    - secretKey: OAUTH_CLIENT_SECRET_KEY
      remoteRef:
        key: memory-manager/oauth
        property: fernet-key
