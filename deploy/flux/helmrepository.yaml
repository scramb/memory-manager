#
# OCI source for the chart on GHCR (`.github/workflows/release.yml`
# publishes every tagged release there as
# `oci://ghcr.io/scramb/charts/memory-manager`; this `HelmRepository`
# points at the repository root, `helmrelease.yaml`'s own `chart` → `spec`
# → `chart` field names the chart within it, Flux's own convention for an
# OCI `HelmRepository`). Anonymous pull - GHCR serves public packages
# without a `secretRef`; a private one needs this spec's own `secretRef`
# with a `kubernetes.io/dockerconfigjson` Secret instead, an operator's own
# overlay concern.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: memory-manager
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  type: oci
  url: oci://ghcr.io/scramb/charts
  interval: 1h
