#
# `memory-manager` as the generic default (same name `deploy/README.md`'s
# own Flux `Kustomization` example uses for `targetNamespace`) - an
# operator who wants a different namespace renames this file's own `name`
# and the `namespace:` transformer in `kustomization.yaml` together, in
# their own fork/overlay, not here (CLAUDE.md: no operator-specific values
# in this public repository).
apiVersion: v1
kind: Namespace
metadata:
  name: memory-manager
  labels:
    app.kubernetes.io/name: memory-manager
