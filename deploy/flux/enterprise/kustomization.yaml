#
# Enterprise Flux example (#257, WP-30): the same namespace.yaml/
# helmrepository.yaml shape as ../kustomization.yaml (duplicated, not
# referenced by relative path - see namespace.yaml's own comment here
# for why) plus this directory's own externalsecret.yaml/helmrelease.yaml,
# which install the chart's enterprise profile instead of the
# single-replica defaults ../kustomization.yaml applies.
#
# An operator applies this through their own Flux Kustomization pointed
# at this directory (same shape as ../README.md's own example, with
# `path: ./deploy/flux/enterprise` instead), patching the placeholders
# below to their own values - never by editing them in place here
# (CLAUDE.md: a public repository carries no operator-specific values).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memory-manager

resources:
  - namespace.yaml
  - helmrepository.yaml
  - externalsecret.yaml
  - helmrelease.yaml
