#
# Two ExternalSecrets instead of ../externalsecret.yaml's one: the app
# Secret helmrelease.yaml's own `secrets` -> `existingSecret` points at
# (VAULT_WEBHOOK_SECRET, OAUTH_CLIENT_SECRET_KEY, ENTRA_CLIENT_SECRET - no
# SSH_*/OIDC_* keys, since storage's own backend "postgres" never clones
# the vault and login's own mode "entra" never reads the oidc sub-block
# (charts/memory-manager/templates/api-deployment.yaml) - and the CNPG
# Barman Cloud plugin backup credentials Secret helmrelease.yaml's own
# `database` -> `cnpg` -> `backup` -> `existingSecret` points at
# (ACCESS_KEY_ID/ACCESS_SECRET_KEY, templates/cnpg-objectstore.yaml).
# Same ClusterSecretStore placeholder as ../externalsecret.yaml - patch
# it to the operator's own store. The SOPS alternative
# (../README.md's own "Secrets" section) applies here identically; this
# directory does not repeat the illustrative files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-manager-secrets
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: memory-manager-secrets
    creationPolicy: Owner
  data:
    - secretKey: VAULT_WEBHOOK_SECRET
      remoteRef:
        key: memory-manager/webhook
        property: secret
    - secretKey: OAUTH_CLIENT_SECRET_KEY
      remoteRef:
        key: memory-manager/oauth
        property: fernet-key
    - secretKey: ENTRA_CLIENT_SECRET
      remoteRef:
        key: memory-manager/entra
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-manager-backup-credentials
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: memory-manager-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: memory-manager/backup-object-store
        property: access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: memory-manager/backup-object-store
        property: secret-access-key
