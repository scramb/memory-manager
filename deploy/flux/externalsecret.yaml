#
# The `ExternalSecret` the Helm chart's own `secrets` → `existingSecret`
# value in `helmrelease.yaml` points at - same keys as `deploy/secrets.yaml`
# (that generic Kustomize base's own copy of this, see its comment and
# `deploy/README.md`'s "Required secrets" table for how to generate each
# one), pulled from an operator's own External Secrets Operator
# `ClusterSecretStore` instead of committed to Git. `sops-secret.example.yaml`
# in this directory shows the alternative (secrets committed to Git,
# encrypted) for an operator without a secret-store backend already
# running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-manager-secrets
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    # Must equal the Helm release's own `secrets` → `existingSecret` value
    # (`helmrelease.yaml`) - the chart's `<fullname>-secrets` default would
    # resolve to the same name only when the release is also named
    # `memory-manager` (the chart's own helper templates compute
    # `fullname`); setting both explicitly keeps that out of the
    # coincidence category.
    name: memory-manager-secrets
    creationPolicy: Owner
  data:
    - secretKey: SSH_PRIVATE_KEY
      remoteRef:
        key: memory-manager/vault-deploy-key
        property: private-key
    - secretKey: SSH_KNOWN_HOSTS
      remoteRef:
        key: memory-manager/vault-deploy-key
        property: known-hosts
    - secretKey: VAULT_WEBHOOK_SECRET
      remoteRef:
        key: memory-manager/webhook
        property: secret
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: memory-manager/oidc
        property: client-secret
    - secretKey: OAUTH_CLIENT_SECRET_KEY
      remoteRef:
        key: memory-manager/oauth
        property: fernet-key
