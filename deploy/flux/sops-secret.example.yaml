#
# EXAMPLE ONLY - shows the shape `sops -e -i sops-secret.example.yaml`
# (with .sops.yaml's own rule in this directory) leaves a plain Kubernetes
# Secret in, not a working encrypted file: the `ENC[...]` entries below are
# typed by hand to illustrate that shape, not produced by a real `sops -e`
# run, so this file does NOT decrypt with any key (CLAUDE.md: no real keys,
# no operator-specific values in a public repository). README.md's "SOPS
# alternative" section covers what turns this into a real one: run
# `sops -e -i` for real against your own age/PGP key, commit the result
# instead of this illustrative file, and add a `decryption` field to your
# own Flux `Kustomization` pointing at a Secret holding the matching
# private key - NOT a resource of kustomization.yaml here, same reason.
apiVersion: v1
kind: Secret
metadata:
  name: memory-manager-secrets
  labels:
    app.kubernetes.io/name: memory-manager
type: Opaque
stringData:
  SSH_PRIVATE_KEY: ENC[AES256_GCM,data:bm90IGEgcmVhbCB2YWx1ZQ==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
  SSH_KNOWN_HOSTS: ENC[AES256_GCM,data:bm90IGEgcmVhbCB2YWx1ZQ==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
  VAULT_WEBHOOK_SECRET: ENC[AES256_GCM,data:bm90IGEgcmVhbCB2YWx1ZQ==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
  OIDC_CLIENT_SECRET: ENC[AES256_GCM,data:bm90IGEgcmVhbCB2YWx1ZQ==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
  OAUTH_CLIENT_SECRET_KEY: ENC[AES256_GCM,data:bm90IGEgcmVhbCB2YWx1ZQ==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
sops:
  age:
    - recipient: age1exampleexampleexampleexampleexampleexampleexampleexamplex
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        not a real sops output, illustrative only
        -----END AGE ENCRYPTED FILE-----
  lastmodified: "2026-10-07T00:00:00Z"
  mac: ENC[AES256_GCM,data:bm90IHJlYWw=,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
  version: 3.9.1
