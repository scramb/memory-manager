# SPDX-License-Identifier: AGPL-3.0-only
#
# One replica, `strategy: Recreate`: memory-manager is a single writer to
# the vault's git remote (ADR-0003/the write queue) and the in-process
# OAuth login rate limiter (ADR-0004) is per-process state - two replicas
# would mean two independent writers/limiters, not one scaled service.
# `Recreate` (not the Deployment default `RollingUpdate`) guarantees the
# old pod is gone before the new one starts, so there is never a moment
# with two running at once during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-manager
  labels:
    app.kubernetes.io/name: memory-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-manager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory-manager
          image: ghcr.io/scramb/memory-manager
          ports:
            - name: http
              containerPort: 8080
          env:
            # Must match exactly what a client is told (ADR-0004) -
            # operator overlay, placeholder here.
            - name: PUBLIC_URL
              value: https://memory.example.com
            # Assembled by CloudNativePG into the Secret
            # "<cluster-name>-app" (database.yaml); "uri" is the full
            # libpq connection string, including the generated password.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: memory-manager-db-app
                  key: uri
            # The vault's git remote - operator overlay, placeholder here.
            # VAULT_DIR defaults to /data/vault (the image's own ENV),
            # which is exactly where the "vault" emptyDir below is
            # mounted: Git is the source of truth, so this clone is
            # rebuilt from VAULT_REMOTE on every pod start, never
            # persisted on its own.
            - name: VAULT_REMOTE
              value: "git@git.example.com:memory-manager/vault.git"
            - name: VAULT_BRANCH
              value: main
            - name: VAULT_SSH_KEY_FILE
              value: /etc/memory-manager/ssh/id_ed25519
            # Recommended for production (deploy/README.md): pins the
            # remote's host key instead of trusting whoever answers on
            # first contact (`StrictHostKeyChecking=accept-new`, the
            # default without this set).
            - name: VAULT_SSH_KNOWN_HOSTS
              value: /etc/memory-manager/ssh/known_hosts
            - name: VAULT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-manager-secrets
                  key: VAULT_WEBHOOK_SECRET
            # Login at /authorize (ADR-0004 L2) - upstream OIDC in
            # production; LOGIN_MODE=password (plus ADMIN_PASSWORD_HASH)
            # is the quickstart alternative, see deploy/README.md.
            - name: LOGIN_MODE
              value: oidc
            - name: OIDC_ISSUER
              value: https://idp.example.com
            - name: OIDC_CLIENT_ID
              value: memory-manager
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-manager-secrets
                  key: OIDC_CLIENT_SECRET
            # Deny-by-default allowlist (ADR-0004 addendum) - operator
            # overlay, placeholder here.
            - name: OIDC_ALLOWED_EMAILS
              value: you@example.com
            # Subjects with no entry in LOGIN_NAMESPACE_MAP fall back to
            # this; adjust to the operator's own vault layout.
            - name: LOGIN_NAMESPACES
              value: personal
            - name: OAUTH_CLIENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-manager-secrets
                  key: OAUTH_CLIENT_SECRET_KEY
            - name: LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          # 503 while the vault clone or the database is unreachable.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # VAULT_DIR (/data/vault, the image's default) and the vault
            # webhook both live here; emptyDir on purpose - Git is the
            # source of truth, this clone is rebuilt on every start, never
            # a thing to persist or back up on its own.
            - name: vault-data
              mountPath: /data
            # Read-only; the Kubernetes Secret volume may mount these
            # keys group-/other-readable under fsGroup (CLAUDE.md's SSH
            # runtime fix, vault/repo.py's `_ssh_key_file()`) - the server
            # itself copies an unsafe key to a private 0600 temp file
            # before ever handing it to `ssh`.
            - name: ssh
              mountPath: /etc/memory-manager/ssh
              readOnly: true
            # HOME=/tmp (the image's own ENV) and the read-only root
            # filesystem both need this writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault-data
          emptyDir: {}
        - name: ssh
          secret:
            secretName: memory-manager-secrets
            items:
              - key: SSH_PRIVATE_KEY
                path: id_ed25519
              - key: SSH_KNOWN_HOSTS
                path: known_hosts
        - name: tmp
          emptyDir: {}
