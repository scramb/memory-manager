#
# Postgres 16 + pgvector (PLAN: a derived, fully rebuildable search index -
# `memory-manager reindex --full` repopulates it from the vault, so losing
# this `Cluster` loses only the index, never a note). One instance: the
# vault is the source of truth, not this database, so the usual "replicas
# for availability" argument does not apply here the way it would for a
# primary store; an operator who wants more resilience adds replicas in
# their own overlay.
#
# `ghcr.io/cloudnative-pg/postgresql:16-standard-trixie`: a CNPG operand
# image (CNPG's instance manager requires its own image layout - the stock
# `pgvector/pgvector` image `compose.yaml` runs locally is NOT one) that
# already ships the `vector` extension compiled in.
#
# `postInitApplicationSQL` creates the extension once, as the bootstrap
# (superuser) role, right after `initdb`: the app's own database role
# (`memory_manager`, what `DATABASE_URL` ultimately authenticates as) is
# never a superuser, and `CREATE EXTENSION` needs one unless the extension
# is already there - at which point `memory-manager`'s own migration 0001
# (`CREATE EXTENSION IF NOT EXISTS vector`) runs as a no-op requiring no
# such privilege (verified directly in `tests/db/test_migrations.py`,
# `TestMigrate::test_succeeds_for_a_non_superuser_role_once_vector_already_exists`).
#
# `prune: disabled`: a Flux prune would delete this `Cluster` and, with
# it, the PVC - there is nothing to prune back to, only a full reindex.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: memory-manager-db
  labels:
    app.kubernetes.io/name: memory-manager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie
  bootstrap:
    initdb:
      database: memory_manager
      owner: memory_manager
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"
  storage:
    # No `storageClass` here on purpose - the cluster's default storage
    # class is used unless an operator overlay sets one explicitly.
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
