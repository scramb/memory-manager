#
# The WP-22 mock IdP (tests/mock_idp/, image tests/mock_idp/Containerfile),
# in-cluster so the Entra-mode api Deployment's own `/readyz` (ADR-0009 §5:
# true only once Entra discovery succeeds) has something real to discover
# against (helmrelease-patch.yaml's own `login.entra.authority` points here).
# Not part of a real deployment - this directory is test-only
# (kustomization.yaml's own comment) - so this lives next to the overlay
# that needs it, not under deploy/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-idp
  namespace: memory-manager
  labels:
    app.kubernetes.io/name: mock-idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-idp
    spec:
      containers:
        - name: mock-idp
          image: localhost:5001/mock-idp:e2e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Matches this Service's own in-cluster DNS name - see
            # helmrelease-patch.yaml's own login.entra.authority, which must
            # equal this exactly (EntraAuthenticator builds its discovery
            # issuer as "{authority}/{tenantId}/v2.0", app.py's own
            # `_issuer_base` uses this verbatim rather than falling back to
            # the request's Host header).
            - name: MOCK_IDP_ISSUER_BASE
              value: http://mock-idp.memory-manager.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /_mock/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_mock/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mock-idp
  namespace: memory-manager
  labels:
    app.kubernetes.io/name: mock-idp
spec:
  selector:
    app.kubernetes.io/name: mock-idp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Additive to (not a replacement of) the chart's own "memory-manager-api"
# NetworkPolicy (charts/memory-manager/templates/networkpolicy.yaml):
# Kubernetes unions every NetworkPolicy that selects a given pod, so this
# only adds one more allowed egress destination for the api pods, it does
# not need to repeat DNS/CNPG/443 from that policy. Needed because that
# policy's own egress helper (`memory-manager.networkPolicyAppEgress`) only
# ever opens port 443 for "whatever other HTTPS service the app talks to"
# (the vault remote, a real Entra authority, an embedding provider) - every
# real deployment's own Entra authority is HTTPS on 443 (ADR-0006), but this
# E2E's own mock IdP deliberately runs plain HTTP on 8080
# (ENTRA_ALLOW_INSECURE_AUTHORITY, helmrelease-patch.yaml) to avoid standing
# up a real TLS cert for a test fixture - a port the chart's template has no
# reason to know about. A chart-side fix would be the wrong place for this:
# it is this overlay's own authority choice, not a gap a real deployment
# would ever hit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-idp-api-egress
  namespace: memory-manager
  labels:
    app.kubernetes.io/name: mock-idp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memory-manager
      app.kubernetes.io/instance: memory-manager
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mock-idp
      ports:
        - protocol: TCP
          port: 8080
