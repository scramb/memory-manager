#
# Plain Secret standing in for ../../../deploy/flux/enterprise/
# externalsecret.yaml's "memory-manager-secrets" target (deleted by
# delete-externalsecrets.yaml - no External Secrets Operator in the kind
# cluster), matching helmrelease.yaml's own `secrets` -> `existingSecret`.
# Every value here is a fixed, fake, test-only secret, not a real one -
# OAUTH_CLIENT_SECRET_KEY still has to be a *syntactically* valid Fernet key
# (`cryptography.fernet.Fernet`), since `auth.store.ClientSecretCipher`
# rejects a malformed one at startup (ADR-0004); the other two are read only
# by code paths this E2E's Entra-discovery-only `/readyz` check never
# reaches (ENTRA_CLIENT_SECRET is for the Graph app-token exchange,
# VAULT_WEBHOOK_SECRET for the push webhook - WP-30's own "Not included":
# the Entra sign-in flow itself).
apiVersion: v1
kind: Secret
metadata:
  name: memory-manager-secrets
  namespace: memory-manager
  labels:
    app.kubernetes.io/name: memory-manager
type: Opaque
stringData:
  VAULT_WEBHOOK_SECRET: e2e-test-webhook-secret
  OAUTH_CLIENT_SECRET_KEY: "5iTJzeL_VGQfY_hPene4yA27QJTp2YPPQ4AjbtocHy0="
  ENTRA_CLIENT_SECRET: e2e-test-entra-client-secret
