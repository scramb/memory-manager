# SPDX-License-Identifier: AGPL-3.0-only
# Question set for #151 (WP-44, F-02): "does the filter mode help a small
# local model give usable answers" - scored by
# tests/e2e/clients/test_openwebui_small_model.py against the fictional
# `examples/vault` (same fixture eval/golden.yaml uses for recall@5/MRR).
#
# Each entry: {id, question, lang: de|en, expected_any: [...], source_path}.
# - `question`: natural-language, asked in `lang` - memory-manager's search
#   uses Postgres's 'simple' tsvector config (no cross-language stemming,
#   search.py's own `_HEADLINE_SQL`), so a question must share literal
#   tokens with its note's own language to have a chance of surfacing it;
#   eval/golden.yaml's own q01 ("Welchen Editor nutzt Mara aktuell?") is the
#   same phrasing style this file follows.
# - `expected_any`: one or more case-insensitive substrings (umlaut-folded
#   by the test's own scoring), ANY of which counts as the fact being
#   present in a chat answer - never a verbatim substring of `question`
#   itself (checked once by the test module at collection time), so a model
#   cannot "pass" by merely echoing the question back.
# - `source_path`: the one `examples/vault` note the fact is drawn from
#   (title/description only, or a short body phrase a `ts_headline` snippet
#   - MaxWords=35 - would plausibly include, `search.py:631`): what the
#   filter's inlet can actually inject, never something only a human skim
#   of the whole vault would know.
#
# Two supersede cases (q23/q24): the *current* note is the only one that can
# ever surface - search.py excludes any note past its own `valid_to`
# (search.py:405/489/576), and both `*-2025.md`/`*-v1.md` superseded notes
# are already in the past relative to any run of this question set.
#
# Frozen once scored the first time (owner decision 2026-10-11, harness):
# never tuned after a measurement to make a threshold pass.

