# SPDX-License-Identifier: AGPL-3.0-only
#
# Enterprise profile (ADR-0007 storage backend, ADR-0008 namespaces,
# ADR-0009 stateless replicas): storage's own backend set to "postgres"
# instead of the default single-writer "git" Deployment, 3 api replicas
# behind a PDB, 2 worker replicas, Entra login, a CPU HorizontalPodAutoscaler
# for both Deployments (owner decision O27, ADR-0009 addendum
# 2026-10-08, #251 - KEDA request-rate scaling stays off here; turn the
# api block's own keda sub-block on and its autoscaling sub-block off in
# your own overlay instead), a 3-instance CNPG Cluster with Barman Cloud
# plugin backups (#252), and per-component NetworkPolicies (#255) -
# api/worker/Valkey/the CNPG Cluster's own instances each limited to the
# flows they need. Every hostname/secret-store path below is still a
# placeholder (CLAUDE.md: a public repository carries no
# operator-specific values) - set your own in a further `-f` overlay,
# never by editing this file in place.
storage:
  backend: postgres

# Entra login (ADR-0006) - this mode's own entra sub-block carries the
# ENTRA_* envs/secret the EntraAuthenticator's own `from_env` builder
# actually needs (#257); the oidc sub-block above stays the chart's own
# unused default in this mode.
login:
  mode: entra
  entra:
    # Placeholders only - deploy/entra's OpenTofu module creates the real
    # app registration and prints both (#256); set your own in a further
    # overlay, never by editing this file in place.
    tenantId: "00000000-0000-0000-0000-000000000000"
    clientId: "00000000-0000-0000-0000-000000000000"

database:
  appRole: memory_manager_app
  cnpg:
    # 3 instances, only allowed once storage's own backend is "postgres"
    # (ADR-0007, ADR-0009 §6) - the default profile's single instance.
    instances: 3
    backup:
      # Placeholder bucket/endpoint (values.yaml) - set your own in a
      # further overlay; scripts/check-deploy-placeholders.sh only
      # checks for a real one creeping in here, not that these are set.
      enabled: true

api:
  autoscaling:
    enabled: true

worker:
  autoscaling:
    enabled: true

# Off here: the 3-instance CNPG Cluster above already covers the same
# rate-limit/login state at far more than the expected load (ADR-0009
# §2, docs/research/enterprise.md §5) - Postgres is the fallback, not a
# missing piece. Turn valkey's own enabled flag on in your own overlay
# for Valkey's sub-millisecond counters instead (#254).
valkey:
  enabled: false

# Per-component policies instead of the single git-mode one (#255,
# templates/networkpolicy.yaml) - namespaceSelector/podSelector below
# still default to "{}" (matches everywhere) until set to your own
# gateway/Prometheus/CNPG-operator namespace in a further overlay.
networkPolicy:
  enabled: true

# Two Prometheus scrape jobs instead of one (#264, templates/
# servicemonitor.yaml) - api and worker each get their own component
# label, since they are two independently-scaling Deployments here.
serviceMonitor:
  enabled: true
