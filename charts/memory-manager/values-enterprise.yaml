# SPDX-License-Identifier: AGPL-3.0-only
#
# Enterprise profile (ADR-0007 storage backend, ADR-0008 namespaces,
# ADR-0009 stateless replicas): storage's own backend set to "postgres"
# instead of the default single-writer "git" Deployment, 3 api replicas
# behind a PDB, 2 worker replicas, Entra login, a CPU HorizontalPodAutoscaler
# for both Deployments (owner decision O27, ADR-0009 addendum
# 2026-10-08, #251 - KEDA request-rate scaling stays off here; turn the
# api block's own keda sub-block on and its autoscaling sub-block off in
# your own overlay instead). Every hostname/secret-store path below is
# still a placeholder (CLAUDE.md: a public repository carries no
# operator-specific values) - set your own in a further `-f` overlay,
# never by editing this file in place.
#
# Extended by later WP-29 tasks: CNPG backups and the app role migration
# (29d), Valkey shared state (29f), NetworkPolicies (29g).
storage:
  backend: postgres

# Entra login (ADR-0006) - WP-22 defines the Entra-specific env/secret
# keys this mode actually needs; the oidc block below is unused once
# that lands and stays only as a placeholder until then (#250's own "Not
# included": "Entra env keys beyond placeholders").
login:
  mode: entra
  oidc:
    # Placeholder only - a real tenant's issuer is Microsoft's own fixed
    # identity-platform hostname followed by that tenant's own id; set
    # your own tenant's issuer here.
    issuer: https://login.example.com/00000000-0000-0000-0000-000000000000
    clientId: memory-manager
    allowedEmails: you@example.com

database:
  appRole: memory_manager_app

api:
  autoscaling:
    enabled: true

worker:
  autoscaling:
    enabled: true
