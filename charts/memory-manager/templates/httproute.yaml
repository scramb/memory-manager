#
# The whole host goes to the app: the MCP endpoint (/mcp), the embedded
# authorization server's own routes and metadata (/.well-known/*,
# /authorize, /token, /register, /revoke), the vault webhook
# (/hooks/vault) and /healthz, /readyz. The app itself decides who gets
# in - every MCP request needs a bearer token it issued or verified.
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "memory-manager.fullname" . }}
  labels:
    {{- include "memory-manager.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "memory-manager.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
