#
# storage's own backend "postgres" carries an explicit "api" component
# label on this Service's own metadata (not just its selector below), so
# the ServiceMonitor (templates/servicemonitor.yaml, #264) can filter its
# own api endpoint to this Service and not the worker one
# (templates/worker-service.yaml). Git mode keeps the plain, unqualified
# labels it has always had.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memory-manager.fullname" . }}
  labels:
    {{- if eq .Values.storage.backend "postgres" }}
    {{- include "memory-manager.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
    {{- else }}
    {{- include "memory-manager.labels" . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "memory-manager.selectorLabels" . | nindent 4 }}
    {{- if eq .Values.storage.backend "postgres" }}
    # Only the api Deployment serves client-facing traffic in postgres
    # mode (ADR-0009 §4/#250) - the worker Deployment shares the same
    # base selector, so without this it would get traffic it cannot
    # answer. Unchanged in git mode, where only one Deployment exists.
    app.kubernetes.io/component: api
    {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
