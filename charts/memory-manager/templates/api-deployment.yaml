# SPDX-License-Identifier: AGPL-3.0-only
#
# storage's own backend "postgres" only (ADR-0007, ADR-0009 §4/#250): replaces
# the single "git"-mode Deployment (templates/deployment.yaml) with a
# stateless `api` Deployment that scales - any replica serves any
# request (ADR-0009's own "stateless Streamable HTTP"), so a plain
# RollingUpdate with maxUnavailable: 0 never drops capacity during a
# rollout. No vault clone, no SSH deploy key here: Postgres is the
# source of truth in this mode, not a git remote (ADR-0007).
{{- if eq .Values.storage.backend "postgres" }}
{{- include "memory-manager.validateShutdown" . }}
{{- include "memory-manager.validateApiAutoscaling" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-manager.fullname" . }}-api
  labels:
    {{- include "memory-manager.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  {{- /* Omitted while an autoscaler manages this Deployment (HPA or
  KEDA, templates/hpa.yaml / templates/keda-scaledobject.yaml, #251), so
  a Helm upgrade never resets the replica count the autoscaler set. */}}
  {{- if not (or .Values.api.autoscaling.enabled .Values.api.keda.enabled) }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "memory-manager.componentSelectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memory-manager.componentSelectorLabels" (dict "context" . "component" "api") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memory-manager.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # >= graceSeconds + preStopSleepSeconds (ADR-0009 §5, enforced by
      # the validateShutdown helper included above).
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      {{- if .Values.api.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.api.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "memory-manager.componentSelectorLabels" (dict "context" . "component" "api") | nindent 14 }}
        - maxSkew: {{ .Values.api.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.api.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "memory-manager.componentSelectorLabels" (dict "context" . "component" "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: memory-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Must match exactly what a client is told (ADR-0004).
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            # The non-owner role request transactions switch to before
            # touching a FORCE ROW LEVEL SECURITY table (ADR-0008
            # addendum) - the worker Deployment connects as the owner
            # instead and never gets this variable.
            - name: DATABASE_APP_ROLE
              value: {{ .Values.database.appRole | quote }}
            {{- if .Values.database.cnpg.enabled }}
            # Assembled by CloudNativePG into the Secret
            # "<cluster-name>-app" (templates/cnpg-cluster.yaml); "uri" is
            # the full libpq connection string, including the generated
            # password.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.cnpgClusterName" . }}-app
                  key: uri
            {{- else if .Values.database.existingSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.key | default "uri" }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            - name: VAULT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.secretName" . }}
                  key: VAULT_WEBHOOK_SECRET
            # Login at /authorize (ADR-0004 L2) - upstream OIDC/Entra in
            # production; setting login's own mode to "password" (plus an
            # ADMIN_PASSWORD_HASH secret key) is the quickstart alternative.
            - name: LOGIN_MODE
              value: {{ .Values.login.mode | quote }}
            {{- /* "entra" reuses the OIDC client (ADR-0006 §1); WP-22 adds
            the Entra-specific envs this mode also needs - out of scope
            here (#250's own "Not included"). */}}
            {{- if or (eq .Values.login.mode "oidc") (eq .Values.login.mode "entra") }}
            - name: OIDC_ISSUER
              value: {{ .Values.login.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.login.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.secretName" . }}
                  key: OIDC_CLIENT_SECRET
            # Deny-by-default allowlist (ADR-0004 addendum).
            - name: OIDC_ALLOWED_EMAILS
              value: {{ .Values.login.oidc.allowedEmails | quote }}
            {{- else }}
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.secretName" . }}
                  key: ADMIN_PASSWORD_HASH
            {{- end }}
            # Subjects with no entry in LOGIN_NAMESPACE_MAP fall back to
            # this; adjust to your own namespace layout.
            - name: LOGIN_NAMESPACES
              value: {{ .Values.login.namespaces | quote }}
            - name: OAUTH_CLIENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.secretName" . }}
                  key: OAUTH_CLIENT_SECRET_KEY
            {{- /* Shared rate-limit/login state in Valkey instead of
            Postgres (ADR-0009 §2, #254) - the chart's own Deployment
            (templates/valkey.yaml) when valkey's own enabled flag is
            true, or an operator-managed instance via externalUrl.
            Unset falls back to Postgres (this Deployment's own
            STORAGE_BACKEND) or in-process state. */}}
            {{- if or .Values.valkey.enabled .Values.valkey.externalUrl }}
            {{- if and .Values.valkey.enabled .Values.valkey.existingSecret }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret }}
                  key: {{ .Values.valkey.passwordKey | default "password" }}
            {{- end }}
            - name: VALKEY_URL
              value: {{ (ternary (include "memory-manager.valkeyUrl" .) .Values.valkey.externalUrl .Values.valkey.enabled) | quote }}
            {{- end }}
            {{- if ne .Values.embedding.provider "none" }}
            - name: EMBEDDING_PROVIDER
              value: {{ .Values.embedding.provider | quote }}
            - name: EMBEDDING_URL
              value: {{ .Values.embedding.url | quote }}
            {{- if .Values.embedding.model }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            {{- end }}
            {{- if .Values.embedding.dimensions }}
            - name: EMBEDDING_DIMENSIONS
              value: {{ .Values.embedding.dimensions | quote }}
            {{- end }}
            {{- if .Values.embedding.apiKeySecretKey }}
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-manager.secretName" . }}
                  key: {{ .Values.embedding.apiKeySecretKey }}
            {{- end }}
            {{- end }}
            {{- if not .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "false"
            {{- end }}
            - name: SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.shutdown.graceSeconds | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
          lifecycle:
            # Sleep before SIGTERM, so the load balancer has time to stop
            # routing here before uvicorn's own drain even starts
            # (ADR-0009 §5); `/readyz` already flips to 503 on SIGTERM
            # itself (http.py's GracefulShutdownServer), this covers the
            # window before that signal is even sent.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.shutdown.preStopSleepSeconds }}"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          # 503 while the database is unreachable, or once SIGTERM has
          # arrived (ADR-0009 §5).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # HOME=/tmp (the image's own ENV) and the read-only root
            # filesystem both need this writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
