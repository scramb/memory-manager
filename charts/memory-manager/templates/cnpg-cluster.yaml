#
# Postgres 16 + pgvector (PLAN: a derived, fully rebuildable search index -
# `memory-manager reindex --full` repopulates it from the vault, so losing
# this Cluster loses only the index, never a note). Requires the
# CloudNativePG operator already installed in the cluster - this chart
# only renders the Cluster custom resource, not the operator itself.
#
# The cnpg block's `imageName` value must be a CNPG operand image (the
# stock `pgvector/pgvector` image compose.yaml runs locally is NOT one -
# CNPG's instance manager requires its own image layout); the default,
# `ghcr.io/cloudnative-pg/postgresql:16-standard-trixie`, already ships the
# vector extension compiled in. `postInitApplicationSQL` creates it once,
# as the bootstrap (superuser) role, right after `initdb` - the app's own
# database role is never a superuser, and `CREATE EXTENSION` needs one
# unless the extension is already there, at which point memory-manager's
# own migration 0001 (`CREATE EXTENSION IF NOT EXISTS vector`) runs as a
# no-op requiring no such privilege (verified directly in
# `tests/db/test_migrations.py`,
# `TestMigrate::test_succeeds_for_a_non_superuser_role_once_vector_already_exists`).
{{- if .Values.database.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "memory-manager.cnpgClusterName" . }}
  labels:
    {{- include "memory-manager.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.cnpg.instances }}
  imageName: {{ .Values.database.cnpg.imageName }}
  bootstrap:
    initdb:
      database: memory_manager
      owner: memory_manager
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"
  storage:
    {{- with .Values.database.cnpg.storage.storageClassName }}
    storageClass: {{ . }}
    {{- end }}
    size: {{ .Values.database.cnpg.storage.size }}
  resources:
    {{- toYaml .Values.database.cnpg.resources | nindent 4 }}
{{- end }}
