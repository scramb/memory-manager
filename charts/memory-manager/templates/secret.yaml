#
# Chart-managed Secret, built straight from the secrets block's own
# "values" in plain `values.yaml`/`--set` - the quick-install path, off
# by default. A production install should set the secrets block's own
# "existingSecret" to a Secret created out-of-band (External Secrets
# Operator, SOPS, `kubectl create secret`, ...) instead: a Helm values
# file (even one never committed) is
# a worse place for credentials than a Secret resource that at least gets
# etcd-level encryption-at-rest and RBAC on its own. Same key names either
# way (deploy/secrets.yaml's own table).
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memory-manager.secretName" . }}
  labels:
    {{- include "memory-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.values.sshPrivateKey }}
  SSH_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.sshKnownHosts }}
  SSH_KNOWN_HOSTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.vaultWebhookSecret }}
  VAULT_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.oauthClientSecretKey }}
  OAUTH_CLIENT_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.adminPasswordHash }}
  ADMIN_PASSWORD_HASH: {{ . | quote }}
  {{- end }}
{{- end }}
