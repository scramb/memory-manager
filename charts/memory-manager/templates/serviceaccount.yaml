#
# Off by default (deploy/deployment.yaml's own pod sets
# automountServiceAccountToken: false and needs no identity of its own);
# an operator who wires up IRSA/Workload Identity or a PSP-adjacent policy
# bound to a ServiceAccount turns this on in their own values.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "memory-manager.serviceAccountName" . }}
  labels:
    {{- include "memory-manager.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
