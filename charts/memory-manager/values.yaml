# SPDX-License-Identifier: AGPL-3.0-only
#
# Default values for memory-manager. Every hostname/email/secret-store
# name below is a placeholder (CLAUDE.md: a public repository carries no
# operator-specific values) - set your own in a `-f my-values.yaml` file,
# never by editing this one in place. `charts/memory-manager/README.md`
# documents every key in a table; this file is the inline reference.

# Source of truth for notes (ADR-0007). "git" (default) keeps Postgres as
# a derived, fully rebuildable search index; "postgres" (enterprise) makes
# Postgres itself the source of truth, with append-only revisions. Only
# "postgres" may run more than one replica or an autoscaler (ADR-0009 §6) -
# enforced by both values.schema.json's own "if"/"then" and
# memory-manager's own "validate" helper, since --skip-schema-validation
# exists.
storage:
  backend: git

# Fixed at 0 or 1 while storage's own backend is "git" (also enforced by
# values.schema.json) - memory-manager is a single writer to the vault's
# git remote and the in-process OAuth login rate limiter is per-process
# state (deploy/deployment.yaml's own comment); two replicas would mean
# two independent writers/limiters, not one scaled service. 0 is always
# allowed, to scale the deployment down deliberately. A "postgres"
# backend lifts the maximum (ADR-0007, ADR-0009 §6).
replicaCount: 1

# The separate api and worker Deployments storage's own backend
# "postgres" renders instead of the Deployment above (ADR-0009 §4, #250) - each has
# its own replica count and resources; topologySpreadConstraints spreads
# each component's pods across zones and nodes ("ScheduleAnyway" never
# blocks scheduling when a cluster has only one zone or node).
api:
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  # CPU-based autoscaling/v2 HorizontalPodAutoscaler for the api
  # Deployment (templates/hpa.yaml), storage's own backend "postgres"
  # only (owner decision O27, ADR-0009 addendum 2026-10-08: always a CPU
  # HPA for the enterprise profile). Mutually exclusive with the keda
  # sub-block's own enabled flag below - a KEDA ScaledObject creates its
  # own HPA, so the chart's own "validate" helper fails the render if
  # both are true at once. While either this or the keda sub-block below
  # is enabled, replicaCount above is ignored: the Deployment omits its
  # own replicas field so Helm upgrades never fight the autoscaler over
  # the desired count.
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Optional request-rate scaling instead of the CPU HPA above, api only
  # (owner decision O27, ADR-0009 addendum 2026-10-08: CPU HPA always,
  # RPS scaling optional through KEDA) - renders a KEDA ScaledObject
  # (templates/keda-scaledobject.yaml) with a "cpu" trigger (reusing the
  # targetCPUUtilizationPercentage above) and a "prometheus" trigger on
  # the query below, instead of the HPA. KEDA (https://keda.sh) must
  # already be installed in the cluster; this chart does not install it.
  # minReplicaCount should stay at least the api PDB's own minAvailable
  # (below) plus one, so KEDA never scales below what the PDB allows to
  # be evicted at once.
  keda:
    enabled: false
    minReplicaCount: 3
    maxReplicaCount: 10
    prometheus:
      # Placeholder; point this at your own Prometheus (or
      # Prometheus-compatible) query endpoint.
      serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
      # mm_tool_calls_total (observability/metrics.py) summed across
      # every tool and outcome, as requests/second over a 2-minute
      # window - overridable for a different request-rate signal.
      query: sum(rate(mm_tool_calls_total[2m]))
      threshold: "50"

worker:
  replicaCount: 2
  # WORKER_PORT (default 8090, matching the worker's own default -
  # WP-23); the pod always sets WORKER_HOST=0.0.0.0 so probes can reach
  # it from the kubelet.
  port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  # CPU-based HorizontalPodAutoscaler for the worker Deployment
  # (templates/hpa.yaml), storage's own backend "postgres" only - same
  # owner decision as the api block's own autoscaling sub-block above.
  # No KEDA option here: queue-length scaling of the worker is out of
  # scope (#251's own "Not included").
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Graceful shutdown (ADR-0009 §5), storage's own backend "postgres" only
# - the git-mode Deployment's single replica has no in-flight traffic to
# drain across a rollout the way api/worker do. terminationGracePeriodSeconds
# must be at least graceSeconds + preStopSleepSeconds (the chart's own
# "validateShutdown" helper fails the render otherwise).
shutdown:
  # SHUTDOWN_GRACE_SECONDS - uvicorn's timeout_graceful_shutdown.
  graceSeconds: 20
  # Kubernetes preStop hook: sleep this long before SIGTERM, so the load
  # balancer has time to stop routing here before uvicorn starts
  # draining.
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 40

# PodDisruptionBudget for the api Deployment (ADR-0009 §5), storage's own
# backend "postgres" only - the worker Deployment runs best-effort
# background jobs and needs no PDB of its own.
pdb:
  api:
    minAvailable: 2

# Optional single-primary Valkey for shared rate-limit/login state
# (ADR-0009 §2, #254) - storage's own backend "postgres" already covers
# the same state without it (docs/research/enterprise.md §5: roughly
# 50-100x the expected load), so this is only for setups that want
# Valkey's sub-millisecond counters anyway. Off by default: VALKEY_URL
# stays unset, and api/worker fall back to Postgres (storage's own
# backend "postgres") or in-process state (storage's own backend "git") -
# memory_manager/config.py's own "valkey_url".
valkey:
  enabled: false
  image:
    repository: docker.io/valkey/valkey
    # Pinned, not a floating major tag (CLAUDE.md) - 9.1.2 is the
    # current latest stable release, re-verified 2026-10-08
    # (docs/research/enterprise.md records the source and the version
    # history).
    tag: "9.1.2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Optional auth for the Deployment this chart renders below (ADR-0009
  # §2: this Valkey holds only state that may be lost, so auth is extra
  # hardening, not a prerequisite) - a Secret carrying the password
  # under passwordKey; the chart passes it to valkey-server's own
  # --requirepass and to api/worker's own VALKEY_URL.
  existingSecret: ""
  passwordKey: password
  # Points api/worker at an operator-managed Valkey/Redis elsewhere
  # instead of the Deployment above - a complete VALKEY_URL (redis://,
  # rediss:// or unix://, credentials included if needed - config.py's
  # own "_parse_valkey_url" checks only the scheme). Mutually exclusive
  # with enabled above (the chart's own "validateValkey" helper fails
  # the render otherwise).
  externalUrl: ""

image:
  repository: ghcr.io/scramb/memory-manager
  pullPolicy: IfNotPresent
  # Defaults to the chart's own appVersion when empty - never "latest"
  # (otherwise Git stops being what actually runs, deploy/README.md's own
  # "Rollout" section).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Off by default: the pod sets automountServiceAccountToken: false and
  # needs no Kubernetes identity (deploy/deployment.yaml). Turn on for
  # IRSA/Workload Identity or a policy bound to a ServiceAccount.
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

# Restricted Pod Security Standard - matches deploy/deployment.yaml
# exactly; not meant to be loosened per install.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
  readiness:
    # 503 while the vault clone or the database is unreachable - a longer
    # failureThreshold than liveness's, so a slow initial vault clone does
    # not get the pod killed before it ever becomes ready.
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}

# The server's own canonical URL - must equal the HTTPRoute/Ingress
# hostname exactly, scheme included (ADR-0004: must match exactly what a
# client is told). Placeholder; set your own.
publicUrl: https://memory.example.com

vault:
  # The vault's git remote - not read-only: the server pushes every write
  # back. Placeholder; set your own.
  remote: "git@git.example.com:memory-manager/vault.git"
  branch: main

# Login at /authorize (ADR-0004 L2). "oidc" (default, production) needs an
# upstream provider; "entra" (ADR-0006, enterprise) delegates to Microsoft
# Entra ID instead, via the entra block below - its own tenantId/clientId
# are required once mode is "entra" (chart's own validateEntra helper);
# "password" (deploy/README.md's quickstart alternative) needs the
# secrets block's own "values" adminPasswordHash field (or its
# "existingSecret"'s ADMIN_PASSWORD_HASH key) instead, generated with
# `memory-manager hash-password`.
login:
  mode: oidc
  oidc:
    issuer: https://idp.example.com
    clientId: memory-manager
    # Deny-by-default allowlist (ADR-0004 addendum), comma-separated.
    allowedEmails: you@example.com
  # mode: entra only - the EntraAuthenticator's own `from_env` builder's
  # ENTRA_* variables (src/memory_manager/auth/login_entra.py); unused in
  # every other mode.
  # The client secret lives in the secrets block below (ENTRA_CLIENT_SECRET),
  # never here.
  entra:
    # Required (placeholders; set your own tenant and app registration -
    # deploy/entra's OpenTofu module creates one and prints both, #256).
    tenantId: ""
    clientId: ""
    # Optional - defaults (ADR-0006 §1-§5) match the EntraAuthenticator's
    # own `from_env` fallbacks when left empty/false/null.
    allowedTenants: ""
    authority: ""
    graphUrl: ""
    allowInsecureAuthority: false
    groupsTtlSeconds: null
    accessTokenMinutes: null
    maxSessionSeconds: null
  # Subjects with no entry in LOGIN_NAMESPACE_MAP fall back to this.
  namespaces: personal

# Every embedding API is optional and pluggable (PLAN/CLAUDE.md); "none"
# (default) means full-text search only. "ollama"/"openai" need `url` and,
# for "openai", `model`; `apiKeySecretKey` names a key in the secrets
# block's existingSecret (or the chart-managed secret) to read
# EMBEDDING_API_KEY from, if the provider needs one.
embedding:
  provider: none
  url: ""
  model: ""
  dimensions: null
  apiKeySecretKey: ""

metrics:
  # /metrics on the same port as the MCP endpoint; no auth of its own -
  # restrict with networkPolicy or a ServiceMonitor-scraping-only setup.
  enabled: true

logFormat: json

secrets:
  # An operator-managed Secret carrying the keys deploy/secrets.yaml
  # documents (SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, VAULT_WEBHOOK_SECRET,
  # OIDC_CLIENT_SECRET, OAUTH_CLIENT_SECRET_KEY, ADMIN_PASSWORD_HASH when
  # login's own mode is "password", and ENTRA_CLIENT_SECRET when it is
  # "entra") - recommended for every real install. Defaults to
  # "<release>-memory-manager-secrets" when empty.
  existingSecret: ""
  # Chart-managed Secret from this block's own "values" below instead - a
  # quick-install convenience, NOT for production (templates/secret.yaml):
  # plain values end up in `helm get values`/release history.
  create: false
  values: {}
    # sshPrivateKey: ""
    # sshKnownHosts: ""
    # vaultWebhookSecret: ""
    # oidcClientSecret: ""
    # oauthClientSecretKey: ""
    # adminPasswordHash: ""
    # entraClientSecret: ""

database:
  cnpg:
    # Renders a CloudNativePG Cluster (deploy/database.yaml) and points
    # DATABASE_URL at the Secret CNPG derives from it. Requires the CNPG
    # operator installed in the cluster already (not this chart's job).
    # Set to false and use this block's own "url"/"existingSecret" for an
    # external Postgres instead.
    enabled: true
    # More than 1 requires storage's own backend to be "postgres"
    # (ADR-0007, ADR-0009 §6) - values.schema.json's own "if"/"then" and the
    # chart's own "validateCnpgInstances" helper both fail the render
    # otherwise; values-enterprise.yaml sets 3.
    instances: 1
    # Must be a CNPG operand image, not a stock Postgres image - see
    # templates/cnpg-cluster.yaml's comment. This one ships the `vector`
    # extension compiled in.
    imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie
    storage:
      size: 5Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Barman Cloud plugin backups (#252, docs/research/cnpg-backups.md) -
    # off by default. When enabled, renders an ObjectStore
    # (templates/cnpg-objectstore.yaml), a WAL-archiving plugin entry on
    # the Cluster (templates/cnpg-cluster.yaml) and a ScheduledBackup
    # (templates/cnpg-scheduledbackup.yaml). Needs the Barman Cloud
    # plugin and its own prerequisite, cert-manager, already installed in
    # the CNPG operator's namespace - neither is this chart's job.
    backup:
      enabled: false
      # Seconds-first cron (CNPG's own ScheduledBackup format, not the
      # Kubernetes CronJob one) - daily at 02:00.
      schedule: "0 0 2 * * *"
      # ADR-0007's documented erasure-replay horizon assumes 30 d here
      # (backup retention) + 7 d on top.
      retentionPolicy: 30d
      # Placeholders (CLAUDE.md) - set your own S3-compatible bucket.
      destinationPath: s3://memory-manager-backups/
      endpointURL: https://object-store.example.com
      # A Secret you create out-of-band, carrying the two keys below.
      # Defaults to "<cnpg cluster name>-backup-credentials" when empty.
      existingSecret: ""
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY
      # WAL compression; "" (default) stores WALs uncompressed. One of
      # "", bzip2, gzip, lz4, snappy, xz, zstd.
      compression: gzip
  # Used only when the cnpg block above is disabled.
  url: ""
  existingSecret:
    name: ""
    key: uri
  # DATABASE_APP_ROLE (api only, storage's own backend "postgres") - the
  # non-owner, non-BYPASSRLS role every request transaction switches to
  # before touching a FORCE ROW LEVEL SECURITY content table (ADR-0008
  # addendum "system identity under FORCE RLS"). The operator creates
  # this role and grants it to the owner role already in DATABASE_URL;
  # the worker Deployment connects as the owner instead and never gets
  # this variable (ADR-0008 addendum: system jobs keep bypassing RLS).
  appRole: memory_manager_app

# Gateway API HTTPRoute (deploy/httproute.yaml) - the whole host goes to
# the app, which decides who gets in on its own. Mutually exclusive with
# ingress below in practice (pick whichever your cluster's ingress
# controller supports); both can render at once if you really want to.
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway-name
      namespace: gateway-namespace
  hostnames:
    - memory.example.com

# Classic Ingress, for clusters without Gateway API. Off by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: memory.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Off by default (documented, not a default-on guardrail - CLAUDE.md
# still wants it available). Remote IPs for the vault's git remote, the
# OIDC issuer and an embedding provider are operator-specific and unknown
# to this chart, so the default egress when enabled is allow-all-with-DNS;
# set this block's own "allowAll" to false and list your own "rules" (raw
# NetworkPolicyEgressRule entries) to lock it down further.
#
# Storage's own backend "postgres" only (#255, templates/
# networkpolicy.yaml): "ingress" above becomes the api Deployment's own
# gateway/ingress-controller source instead (the "git" backend keeps
# using it exactly as before); "prometheus" and "cnpgOperator" name the
# two extra sources that mode's per-component policies also need -
# Prometheus reaching api/worker's own metrics port, and the CNPG
# operator reaching its instances' status port. Both default to "{}"
# (matches every namespace/pod) until scoped to where those actually
# run, same as "ingress" above.
networkPolicy:
  enabled: false
  ingress:
    namespaceSelector: {}
    podSelector: {}
  egress:
    allowAll: true
    rules: []
  prometheus:
    namespaceSelector: {}
    podSelector: {}
  cnpgOperator:
    namespaceSelector: {}
    podSelector: {}

# Prometheus Operator ServiceMonitor (observability/metrics.py's own
# /metrics) - off by default, needs the Prometheus Operator CRDs
# installed.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
