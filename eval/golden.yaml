# SPDX-License-Identifier: AGPL-3.0-only
# Golden set for the retrieval eval (recall@5, MRR) against examples/vault.
#
# Each entry: {id, query, expected: [<note ULID>, ...], lang: de|en, kind}.
# `kind` is one of:
#   - exact: query closely echoes the note's title/description, same language
#   - paraphrase: differently worded, same language, tests semantic recall
#   - cross-language: query language differs from the note's language
#   - alias: query uses a note's `aliases` entry, not its slug or title
#   - supersede: a supersede chain exists; `expected` is the current note,
#     never the superseded one, even though both could match on wording
#
# Note ids are taken from examples/vault/**/*.md frontmatter `id` fields.

