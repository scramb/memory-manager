[project]
name = "memory-manager"
version = "0.0.0"
description = "Self-hosted long-term memory for Claude: Markdown notes in Git, a derived Postgres search index, one remote MCP server."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "asyncpg>=0.31.0",
    "cryptography>=42",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "prometheus-client>=0.26.0",
    "pyyaml>=6.0",
]

[project.scripts]
memory-manager = "memory_manager.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-PyYAML>=6.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# `tests/conftest.py` and `tests/vault/conftest.py` are both non-package
# modules (no `__init__.py`); without this, mypy reports a duplicate
# module name instead of resolving each by its path.
explicit_package_bases = true
mypy_path = ["src", "tests"]

# `opentelemetry-sdk`/`opentelemetry-exporter-otlp` are the optional `otel`
# extra (observability/tracing.py, #43) - not installed by `uv sync` without
# `--extra otel`, which is how `make check`/CI run it (CLAUDE.md: few
# dependencies, every external service optional). Without this, mypy fails
# the whole run with "Cannot find implementation or library stub" instead of
# just treating those imports (inside a guarded `try/except ImportError`,
# never required) as untyped.
[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
