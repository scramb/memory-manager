[project]
name = "memory-manager"
version = "0.0.0"
description = "Self-hosted long-term memory for Claude: Markdown notes in Git, a derived Postgres search index, one remote MCP server."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
]

[project.scripts]
memory-manager = "memory_manager.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-PyYAML>=6.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# `tests/vault` has its own `conftest.py` with helpers some of its test
# modules import via a bare `from conftest import ...`; listed here so
# mypy resolves that the same way Python's import system does (shared
# fixtures live in the root `tests/conftest.py` instead, which needs no
# special-casing).
explicit_package_bases = true
mypy_path = ["src", "tests/vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
