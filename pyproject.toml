[project]
name = "memory-manager"
version = "0.0.0"
description = "Self-hosted long-term memory for Claude: Markdown notes in Git, a derived Postgres search index, one remote MCP server."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-PyYAML>=6.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_manager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# `tests/vault` and `tests/db` each have their own `conftest.py`; without
# this, mypy maps both to the same top-level "conftest" module and fails
# with "Duplicate module named conftest". `tests/vault` is listed so its
# existing bare `from conftest import ...` still resolves the same way.
explicit_package_bases = true
mypy_path = ["src", "tests/vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
